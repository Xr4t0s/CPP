name: C++ Modules CI

on:
  push:
    paths:
      - 'cpp*/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install compiler
        run: sudo apt-get install -y build-essential

      - name: Detect changed modules
        id: changes
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | cut -d/ -f1 | sort -u > modules.txt
          cat modules.txt

      - name: Build changed modules
        run: |
          while read module; do
            echo "Building $module"
            for ex in $(find $module -name Makefile); do
              make -C $(dirname $ex)
            done
          done < modules.txt
